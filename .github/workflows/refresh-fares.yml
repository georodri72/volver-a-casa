name: Refresh fares
# Runs on GitHub Actions (free for public repos; private repos get a monthly free minutes quota).
# Does nothing until the TRAVELPAYOUTS_TOKEN repository secret exists.
on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC); fares older than 6 h are hidden
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh-fares
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch fares
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: |
          python3 scripts/refresh_fares.py
          python3 scripts/refresh_calendar.py   # month view; self-throttled to every 6 h; appends 1 history line per UTC day
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data data; then echo "no change"; exit 0; fi
          git config user.name "fares-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/fares.json public/data/calendar.json data/history.jsonl
          git commit -m "Refresh fares"
          git push
